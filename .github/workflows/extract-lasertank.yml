name: Extract LaserTank archive
# Runs when the source archive or this workflow changes.

on:
  push:
    paths:
      - 'LaserTank.zip'
      - '.github/workflows/extract-lasertank.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate and extract archive
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          import shutil
          import stat
          import zipfile
          from pathlib import PurePosixPath

          archive = "LaserTank.zip"
          staging = ".lasertank-extract"
          if not os.path.isfile(archive):
              raise SystemExit("LaserTank.zip is missing")

          with zipfile.ZipFile(archive) as zf:
              infos = zf.infolist()
              if not infos:
                  raise SystemExit("Archive is empty")

              paths = []
              for info in infos:
                  name = info.filename
                  path = PurePosixPath(name)
                  if not name or path.is_absolute() or ".." in path.parts or "\\" in name:
                      raise SystemExit(f"Unsafe archive path: {name!r}")
                  if path.parts and path.parts[0] in (".git", ".github", "LaserTank.zip"):
                      raise SystemExit(f"Archive may not overwrite protected path: {name!r}")
                  if stat.S_ISLNK(info.external_attr >> 16):
                      raise SystemExit(f"Symbolic links are not allowed: {name!r}")
                  paths.append(path)

              first_parts = {p.parts[0] for p in paths if p.parts}
              has_root_files = any(
                  len(path.parts) == 1 and not info.is_dir()
                  for info, path in zip(infos, paths)
              )
              strip_root = next(iter(first_parts)) if len(first_parts) == 1 and not has_root_files else None

              shutil.rmtree(staging, ignore_errors=True)
              os.makedirs(staging)
              for info, path in zip(infos, paths):
                  parts = path.parts[1:] if strip_root and path.parts and path.parts[0] == strip_root else path.parts
                  if not parts:
                      continue
                  target = os.path.join(staging, *parts)
                  if info.is_dir():
                      os.makedirs(target, exist_ok=True)
                      continue
                  os.makedirs(os.path.dirname(target), exist_ok=True)
                  with zf.open(info) as src, open(target, "wb") as dst:
                      shutil.copyfileobj(src, dst)

          # Merge extracted entries into the repository, preserving the archive
          # and this workflow. Existing files with matching paths are replaced.
          for name in os.listdir(staging):
              src = os.path.join(staging, name)
              dst = os.path.join(os.getcwd(), name)
              if os.path.isdir(src) and not os.path.islink(src):
                  if os.path.exists(dst) and not os.path.isdir(dst):
                      os.remove(dst)
                  shutil.copytree(src, dst, dirs_exist_ok=True)
              else:
                  if os.path.isdir(dst):
                      shutil.rmtree(dst)
                  shutil.copy2(src, dst)
          shutil.rmtree(staging)
          PY

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No extracted changes to commit."
          else
            git commit -m "Extract LaserTank.zip"
            git push
          fi
